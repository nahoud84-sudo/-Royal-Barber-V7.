
name: Build Royal Barber V7 APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Supervisor and Owner APKs
        run: gradle :app:assembleDebug :owner:assembleDebug --no-daemon

      - name: Upload Supervisor APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Barber-Supervisor
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Owner APK
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Barber-Owner
          path: owner/build/outputs/apk/debug/*.apk
